# File: Setup/recipes.conf
# Purpose: How to check for, and install, each component per platform.
#
# Data-driven, so a new OS family is new lines here, not new code:
#   <component>.<field> = value       (a line ending in \ continues on the next)
#   desc     what it is
#   check    a shell test that succeeds when it is present
#   <family> the install command (fedora | rhel | apt)

gcc.desc   = GCC 14 or later, for C++23
gcc.check  = v=$(g++ -dumpversion 2>/dev/null | cut -d. -f1); [ -n "$v" ] && [ "$v" -ge 14 ]
gcc.fedora = sudo dnf install -y gcc gcc-c++
gcc.rhel   = sudo dnf install -y gcc-toolset-14
gcc.apt    = sudo apt-get install -y g++-14

clang.desc   = Clang 19 or later, the second compiler every change must pass
clang.check  = v=$(clang++ -dumpversion 2>/dev/null | cut -d. -f1); [ -n "$v" ] && [ "$v" -ge 19 ]
clang.fedora = sudo dnf install -y clang
clang.rhel   = sudo dnf install -y clang
clang.apt    = sudo apt-get install -y clang

cmake.desc   = CMake 3.26 or later
cmake.check  = v=$(cmake --version 2>/dev/null | sed -n 's/^cmake version //p'); [ -n "$v" ] && [ "$(printf '3.26\n%s\n' "$v" | sort -V | head -n1)" = "3.26" ]
cmake.fedora = sudo dnf install -y cmake
cmake.rhel   = sudo dnf install -y cmake
cmake.apt    = sudo apt-get install -y cmake

ninja.desc   = Ninja
ninja.check  = command -v ninja >/dev/null 2>&1
ninja.fedora = sudo dnf install -y ninja-build
ninja.rhel   = sudo dnf install -y ninja-build
ninja.apt    = sudo apt-get install -y ninja-build

pkgconfig.desc   = pkg-config
pkgconfig.check  = command -v pkg-config >/dev/null 2>&1
pkgconfig.fedora = sudo dnf install -y pkgconf-pkg-config
pkgconfig.rhel   = sudo dnf install -y pkgconf-pkg-config
pkgconfig.apt    = sudo apt-get install -y pkg-config

wayland.desc   = Wayland client development files and wayland-scanner
wayland.check  = pkg-config --exists wayland-client && command -v wayland-scanner >/dev/null 2>&1
wayland.fedora = sudo dnf install -y wayland-devel
wayland.rhel   = sudo dnf install -y wayland-devel
wayland.apt    = sudo apt-get install -y libwayland-dev libwayland-bin

wayland_protocols.desc   = wayland-protocols, for xdg-shell
wayland_protocols.check  = pkg-config --exists wayland-protocols
wayland_protocols.fedora = sudo dnf install -y wayland-protocols-devel
wayland_protocols.rhel   = sudo dnf install -y wayland-protocols-devel
wayland_protocols.apt    = sudo apt-get install -y wayland-protocols

xkbcommon.desc   = xkbcommon development files
xkbcommon.check  = pkg-config --exists xkbcommon
xkbcommon.fedora = sudo dnf install -y libxkbcommon-devel
xkbcommon.rhel   = sudo dnf install -y libxkbcommon-devel
xkbcommon.apt    = sudo apt-get install -y libxkbcommon-dev

freetype.desc   = FreeType development files
freetype.check  = pkg-config --exists freetype2
freetype.fedora = sudo dnf install -y freetype-devel
freetype.rhel   = sudo dnf install -y freetype-devel
freetype.apt    = sudo apt-get install -y libfreetype-dev

harfbuzz.desc   = HarfBuzz development files
harfbuzz.check  = pkg-config --exists harfbuzz
harfbuzz.fedora = sudo dnf install -y harfbuzz-devel
harfbuzz.rhel   = sudo dnf install -y harfbuzz-devel
harfbuzz.apt    = sudo apt-get install -y libharfbuzz-dev

fontconfig.desc   = fontconfig development files
fontconfig.check  = pkg-config --exists fontconfig
fontconfig.fedora = sudo dnf install -y fontconfig-devel
fontconfig.rhel   = sudo dnf install -y fontconfig-devel
fontconfig.apt    = sudo apt-get install -y libfontconfig-dev
