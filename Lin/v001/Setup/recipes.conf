# File: Setup/recipes.conf
# Purpose: How to check for, and install, each component, per OS. Fedora and Linux Mint have been tested; Red Hat
#          Enterprise Linux is being tested.
#
# Data-driven:
#   <component>.<field> = value             (a line ending in \ continues on the next)
#   <component>.<field>.<os> = value        this OS's own value, used before <component>.<field>
#   <os> is fedora, rhel, linuxmint or zorin, as bsir.sh finds it. rhel uses fedora's own value where it has none: both use dnf.
#   Each line runs from Lin/v001.
#
#   desc       what it is
#   check      a shell test that succeeds when it is present
#   install    the install command
#   c, cxx     for gcc and clang only: the C and C++ compilers a machine is pinned to when it has no pin yet. The build
#              uses the pin (Setup/pinned_compilers.cmake), which another project may have written, and finds each C
#              compiler beside its pinned C++ one
#   compilers  instead of c and cxx: a command that prints the C and then the C++ compiler, one per line
#
# Each OS has its own compilers. Linux Mint's plain g++ (13) and clang++ (18) are too old, so Mint names the same
# versioned compilers jac313 uses there: g++-15 from the ubuntu-toolchain-r PPA and clang++-21 from apt.llvm.org.
# Zorin OS (18: Ubuntu 24.04 noble, like Mint 22) is its own OS. Its lines started as copies of Mint's, to change for
# Zorin alone; its clang names apt.llvm.org's noble repository itself, as jac313 does, since llvm.sh does not know Zorin.

system.update.fedora     = sudo dnf -y upgrade --refresh
system.update.linuxmint  = sudo apt-get update && sudo apt-get -y upgrade
system.update.zorin      = sudo apt-get update && sudo apt-get -y upgrade

gcc.desc.fedora      = GCC 14 or later, for C++23
gcc.check.fedora     = v=$(g++ -dumpversion | cut -d. -f1); [ -n "$v" ] && [ "$v" -ge 14 ]
gcc.install.fedora   = sudo dnf install -y gcc gcc-c++
gcc.c.fedora         = gcc
gcc.cxx.fedora       = g++
gcc.desc.linuxmint     = GCC 15 (g++-15), for C++23
gcc.check.linuxmint    = [ -n "$(command -v g++-15)" ] && [ -n "$(command -v gcc-15)" ]
gcc.install.linuxmint  = sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test && sudo apt-get update && \
                         sudo apt-get install -y gcc-15 g++-15
gcc.c.linuxmint        = gcc-15
gcc.cxx.linuxmint      = g++-15
gcc.desc.zorin         = GCC 15 (g++-15), for C++23
gcc.check.zorin        = [ -n "$(command -v g++-15)" ] && [ -n "$(command -v gcc-15)" ]
gcc.install.zorin      = sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test && sudo apt-get update && \
                         sudo apt-get install -y gcc-15 g++-15
gcc.c.zorin            = gcc-15
gcc.cxx.zorin          = g++-15
gcc.desc.rhel        = GCC: the newest GCC Toolset this system offers, for C++23. The system g++ stays at the release default
gcc.check.rhel       = bash Setup/newest_compilers.sh --check gcc
gcc.install.rhel     = bash Setup/newest_compilers.sh --install gcc
gcc.compilers.rhel   = bash Setup/newest_compilers.sh --compilers gcc

clang.desc.fedora      = Clang 19 or later, the second compiler every change must pass
clang.check.fedora     = v=$(clang++ -dumpversion | cut -d. -f1); [ -n "$v" ] && [ "$v" -ge 19 ]
clang.install.fedora   = sudo dnf install -y clang
clang.c.fedora         = clang
clang.cxx.fedora       = clang++
clang.desc.linuxmint     = Clang 21 (clang++-21) and its clang-query, the second compiler every change must pass
clang.check.linuxmint    = [ -n "$(command -v clang++-21)" ] && [ -n "$(command -v clang-21)" ] && [ -n "$(command -v clang-query-21)" ]
clang.install.linuxmint  = wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s 21 && sudo apt-get install -y clang-tools-21
clang.c.linuxmint        = clang-21
clang.cxx.linuxmint      = clang++-21
clang.desc.zorin         = Clang 21 (clang++-21) and its clang-query, the second compiler every change must pass
clang.check.zorin        = [ -n "$(command -v clang++-21)" ] && [ -n "$(command -v clang-21)" ] && [ -n "$(command -v clang-query-21)" ]
clang.install.zorin      = c="$(. /etc/os-release; echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}")" && \
                         sudo install -d -m 0755 /etc/apt/keyrings && \
                         wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/apt.llvm.org.asc >/dev/null && \
                         echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/$c/ llvm-toolchain-$c-21 main" | \
                         sudo tee /etc/apt/sources.list.d/llvm-21.list >/dev/null && \
                         sudo apt-get update && sudo apt-get install -y clang-21 clang-tools-21
clang.c.zorin            = clang-21
clang.cxx.zorin          = clang++-21
clang.desc.rhel        = Clang: the newest this system offers, and its clang-query, built with the newest GCC Toolset's C++ library
clang.check.rhel       = bash Setup/newest_compilers.sh --check clang
clang.install.rhel     = bash Setup/newest_compilers.sh --install clang
clang.compilers.rhel   = bash Setup/newest_compilers.sh --compilers clang

compiler_rt.desc             = Clang's runtime libraries, for the clang-fuzz preset's libFuzzer and sanitizers
compiler_rt.check.fedora     = rpm -q compiler-rt
compiler_rt.install.fedora   = sudo dnf install -y compiler-rt
compiler_rt.check.linuxmint    = dpkg -s libclang-rt-21-dev
compiler_rt.install.linuxmint  = sudo apt-get install -y libclang-rt-21-dev
compiler_rt.check.zorin        = dpkg -s libclang-rt-21-dev
compiler_rt.install.zorin      = sudo apt-get install -y libclang-rt-21-dev

cmake.desc   = CMake 3.26 or later
cmake.check  = v=$(cmake --version | sed -n 's/^cmake version //p'); [ -n "$v" ] && [ "$(printf '3.26\n%s\n' "$v" | sort -V | head -n1)" = "3.26" ]
cmake.install.fedora     = sudo dnf install -y cmake
cmake.install.linuxmint  = sudo apt-get install -y cmake
cmake.install.zorin      = sudo apt-get install -y cmake

ninja.desc   = Ninja
ninja.check  = [ -n "$(command -v ninja)" ]
ninja.install.fedora     = sudo dnf install -y ninja-build
ninja.install.linuxmint  = sudo apt-get install -y ninja-build
ninja.install.zorin      = sudo apt-get install -y ninja-build

pkgconfig.desc   = pkg-config
pkgconfig.check  = [ -n "$(command -v pkg-config)" ]
pkgconfig.install.fedora     = sudo dnf install -y pkgconf-pkg-config
pkgconfig.install.linuxmint  = sudo apt-get install -y pkgconf
pkgconfig.install.zorin      = sudo apt-get install -y pkgconf

wayland.desc   = Wayland client development files and wayland-scanner
wayland.check  = pkg-config --exists wayland-client && [ -n "$(command -v wayland-scanner)" ]
wayland.install.fedora     = sudo dnf install -y wayland-devel
wayland.install.linuxmint  = sudo apt-get install -y libwayland-dev libwayland-bin
wayland.install.zorin      = sudo apt-get install -y libwayland-dev libwayland-bin

wayland_protocols.desc   = wayland-protocols, for xdg-shell
wayland_protocols.check  = pkg-config --exists wayland-protocols
wayland_protocols.install.fedora     = sudo dnf install -y wayland-protocols-devel
wayland_protocols.install.linuxmint  = sudo apt-get install -y wayland-protocols
wayland_protocols.install.zorin      = sudo apt-get install -y wayland-protocols

xkbcommon.desc   = xkbcommon development files
xkbcommon.check  = pkg-config --exists xkbcommon
xkbcommon.install.fedora     = sudo dnf install -y libxkbcommon-devel
xkbcommon.install.linuxmint  = sudo apt-get install -y libxkbcommon-dev
xkbcommon.install.zorin      = sudo apt-get install -y libxkbcommon-dev

freetype.desc   = FreeType development files
freetype.check  = pkg-config --exists freetype2
freetype.install.fedora     = sudo dnf install -y freetype-devel
freetype.install.linuxmint  = sudo apt-get install -y libfreetype-dev
freetype.install.zorin      = sudo apt-get install -y libfreetype-dev

harfbuzz.desc   = HarfBuzz development files
harfbuzz.check  = pkg-config --exists harfbuzz
harfbuzz.install.fedora     = sudo dnf install -y harfbuzz-devel
harfbuzz.install.linuxmint  = sudo apt-get install -y libharfbuzz-dev
harfbuzz.install.zorin      = sudo apt-get install -y libharfbuzz-dev

fontconfig.desc   = fontconfig development files
fontconfig.check  = pkg-config --exists fontconfig
fontconfig.install.fedora     = sudo dnf install -y fontconfig-devel
fontconfig.install.linuxmint  = sudo apt-get install -y libfontconfig-dev
fontconfig.install.zorin      = sudo apt-get install -y libfontconfig-dev

vim.desc   = Vim, for a machine with only a terminal, and what the file manager's Edit button opens when EDITOR is not set
vim.check  = [ -n "$(command -v vim)" ]
vim.install.fedora     = sudo dnf install -y vim-enhanced
vim.install.linuxmint  = sudo apt-get install -y vim
vim.install.zorin      = sudo apt-get install -y vim

obs.desc   = OBS Studio, what the file manager's Record button starts
obs.check  = [ -n "$(command -v obs)" ]
obs.install.fedora     = sudo dnf install -y obs-studio
obs.install.linuxmint  = sudo apt-get install -y obs-studio
obs.install.zorin      = sudo apt-get install -y obs-studio
obs.desc.rhel          = OBS Studio from Flathub, what the file manager's Record button starts. Red Hat Enterprise Linux has no package for it, so an obs command in ~/.local/bin starts the Flatpak
obs.install.rhel       = flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo && \
                         flatpak install --user -y --noninteractive flathub com.obsproject.Studio && \
                         mkdir -p "$HOME/.local/bin" && printf 'exec flatpak run com.obsproject.Studio "$@"\n' > "$HOME/.local/bin/obs" && \
                         chmod +x "$HOME/.local/bin/obs"

meld.desc   = Meld, what the file manager's Diff button opens. Optional: without it, Diff uses the built-in viewer, for two files only
meld.check  = [ -n "$(command -v meld)" ]
meld.install.fedora     = sudo dnf install -y meld
meld.install.linuxmint  = sudo apt-get install -y meld
meld.install.zorin      = sudo apt-get install -y meld
